<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Lista de Tareas</title>
</head>
<body>

  <main class="contenedor">
    <h1>Mis <span>Tareas</span></h1>

    <form id="formulario">
      <input type="text" id="input-tarea" placeholder="Escribe una tarea...">
      <button type="submit">Agregar</button>
    </form>

    <p id="mensaje-error" class="error"></p>

    <ul id="lista"></ul>

    <div class="pie">
      <p id="contador">0 tareas pendientes</p>
      <button id="btn-limpiar" type="button">Borrar completadas</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
